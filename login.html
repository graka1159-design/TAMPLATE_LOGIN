<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Website Pribadi</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .btn-custom {
            background-color: #59ab6e; /* Warna hijau khas template Zay Shop */
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #498c5a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 class="text-center mb-4">Masuk ke Website</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
            </div>
            <button type="button" class="btn btn-custom w-100" onclick="prosesLogin()">Login</button>
        </form>
        <p class="text-center mt-3 text-muted" style="font-size: 0.9em;">
            Gunakan username: <b>admin</b> & password: <b>123</b>
        </p>
    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
